name: Keep Supabase Alive

on:
  schedule:
    # Tous les jours à 00:00 UTC
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Tester la table articles
        run: |
          URL="${{ secrets.SUPABASE_URL }}/rest/v1/articles?select=id&limit=1"

          HTTP_CODE=$(curl -s \
            -o response.json \
            -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/json" \
            "$URL")

          echo "===================================="
          echo "Date : $(date)"
          echo "HTTP : $HTTP_CODE"
          echo "===================================="

          cat response.json

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Supabase est actif."
          else
            echo "❌ Erreur HTTP $HTTP_CODE"
            exit 1
          fi
