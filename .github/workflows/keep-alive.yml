name: Keep Supabase Alive

on:
  schedule:
    # Tous les jours à 00:00 UTC
    - cron: '0 0 * * *'

  workflow_dispatch:

# Autorise le workflow à supprimer les anciennes exécutions
permissions:
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. TEST SUPABASE
      # ============================================================
      - name: Ping Supabase Keep Alive
        shell: bash
        run: |
          set -e

          URL="${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive"

          echo "==========================================="
          echo "Date : $(date)"
          echo "URL  : $URL"
          echo "==========================================="

          HTTP_CODE=$(curl -s \
            -X POST \
            -o response.json \
            -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{}' \
            "$URL")

          echo ""
          echo "========== HTTP =========="
          echo "$HTTP_CODE"

          echo ""
          echo "========== RESPONSE =========="
          cat response.json

          echo ""
          echo "========== VALIDATION =========="

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Erreur HTTP : $HTTP_CODE"
            exit 1
          fi

          if grep -q "OK" response.json; then
            echo "✅ Fonction keep_alive() exécutée avec succès."
          else
            echo "❌ Réponse inattendue."
            exit 1
          fi

          echo ""
          echo "🎉 Supabase est opérationnel."

      # ============================================================
      # 2. SUPPRESSION DES ANCIENNES EXÉCUTIONS
      # ============================================================
      - name: Supprimer les anciennes exécutions
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "==========================================="
          echo "NETTOYAGE DE L'HISTORIQUE GITHUB ACTIONS"
          echo "==========================================="

          echo "Exécution actuelle : $CURRENT_RUN_ID"

          RUN_IDS=$(gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/keep-alive.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != $CURRENT_RUN_ID) | .id")

          if [ -z "$RUN_IDS" ]; then
            echo "✅ Aucune ancienne exécution à supprimer."
            exit 0
          fi

          for RUN_ID in $RUN_IDS; do
            echo "🗑️ Suppression de l'exécution : $RUN_ID"

            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

            echo "✅ Exécution $RUN_ID supprimée."
          done

          echo ""
          echo "==========================================="
          echo "✅ HISTORIQUE NETTOYÉ"
          echo "==========================================="
