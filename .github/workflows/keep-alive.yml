name: Keep Supabase Alive

on:
  schedule:
    # Tous les jours à 00:00 UTC
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier la table ARTICLES
        run: |
          URL="${{ secrets.SUPABASE_URL }}/rest/v1/ARTICLES?select=*&limit=1"

          STATUS=$(curl -s \
            -o response.json \
            -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/json" \
            "$URL")

          echo "=============================="
          echo "HTTP Status : $STATUS"
          echo "=============================="
          cat response.json
          echo ""
          echo "=============================="

          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Supabase fonctionne."
            exit 0
          else
            echo "❌ Erreur HTTP : $STATUS"
            exit 1
          fi
